<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="logo-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logo-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Logo Mark on Left -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#logo-bg-grad)" stroke="#334155" stroke-width="2" />
    
    <!-- Warehouse Grid lines -->
    <path d="M20 38 H80 M20 56 H80 M20 74 H80" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55" />
    
    <!-- Shelf Beam -->
    <rect x="18" y="68" width="64" height="4.5" rx="2.2" fill="#475569" opacity="0.9" />

    <!-- Sneaker Silhouette -->
    <path d="M25 65 C27 58 31 54 38 54 H47 C51 50 56 46 65 46 C71 46 75 50 77 55 L79 61 C79 63.5 77 65 74 65 Z" fill="url(#logo-amber-grad)" filter="url(#logo-glow)" />
    <path d="M22 66 C22 64.5 24 63.5 26 63.5 H74 C76 63.5 77.5 64.5 77.5 66 L76 70 C76 71 75 71.5 73 71.5 H27 C25 71.5 23.5 71 23 69.5 Z" fill="url(#logo-accent-grad)" />

    <!-- Locator Pin -->
    <g transform="translate(52, 18)">
      <path d="M0 0 C-5.5 0 -10 4.2 -10 9.8 C-10 16.5 0 26 0 26 C0 26 10 16.5 10 9.8 C10 4.2 5.5 0 0 0 Z" fill="url(#logo-amber-grad)" />
      <circle cx="0" cy="9.8" r="3.8" fill="#0F172A" />
      <circle cx="0" cy="9.8" r="2" fill="#10B981" />
    </g>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(130, 0)">
    <!-- Wordmark -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
      WINRAH
    </text>
    
    <!-- Badge -->
    <rect x="200" y="38" width="60" height="24" rx="6" fill="#F59E0B" />
    <text x="230" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Cairo', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      وين راه؟
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Cairo', sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="-0.2">
      Localisation &amp; Gestion Stock Chaussures
    </text>
  </g>
</svg>
