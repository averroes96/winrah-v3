name: Build & Deploy iOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      export_method:
        description: 'iOS Export Method'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - 'ad-hoc'
          - 'app-store'
          - 'development'
          - 'enterprise'
      deploy_to_testflight:
        description: 'Upload to TestFlight / App Store'
        required: false
        type: boolean
        default: false

jobs:
  build-ios:
    name: Build Signed iOS Release (.ipa)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Select Xcode 15 or 16
        run: |
          sudo xcode-select -switch /Applications/Xcode.app || sudo xcode-select -switch /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Check iOS Signing Secrets
        id: check-secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "has_testflight_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_testflight_key=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Apple Certificate & Provisioning Profile
        if: ${{ steps.check-secrets.outputs.has_signing == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'winrah_keychain_pass' }}
        run: |
          # 1. Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 2. Decode base64 secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # 3. Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 4. Import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # 5. Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Create ExportOptions.plist
        run: |
          mkdir -p build
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ github.event.inputs.export_method || 'ad-hoc' }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build & Archive iOS App
        env:
          HAS_SIGNING: ${{ steps.check-secrets.outputs.has_signing }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_NAME }}
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CERT_IDENTITY || 'Apple Distribution' }}
        run: |
          # Build archive using standard Release configuration
          if [ "$HAS_SIGNING" = "true" ]; then
            xcodebuild archive \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              -allowProvisioningUpdates \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
              CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY"
          else
            echo "Building unsigned/development archive for artifact export..."
            xcodebuild archive \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Export Signed .ipa
        if: ${{ steps.check-secrets.outputs.has_signing == 'true' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates

      - name: Package Payload (Fallback / Unsigned IPA)
        if: ${{ steps.check-secrets.outputs.has_signing != 'true' }}
        run: |
          mkdir -p build/output/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/output/Payload/
          cd build/output
          zip -r winrah-ios-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winrah-ios-ipa
          path: build/output/*.ipa
          retention-days: 30

      - name: Upload to TestFlight / App Store Connect
        if: ${{ github.event.inputs.deploy_to_testflight == 'true' && steps.check-secrets.outputs.has_testflight_key == 'true' }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/output/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      - name: Attach .ipa to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/output/*.ipa
          generate_release_notes: true
