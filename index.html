<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WINRAH" />
    <meta name="description" content="WINRAH - Application mobile-first de localisation, transfert et gestion de stocks de chaussures en entrepôt, 100% opérationnelle hors-ligne." />
    <title>WINRAH — Localisation Stock & Entrepôt Chaussures</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('winrah_language');
          var lang = (saved === 'ar' || saved === 'fr') ? saved : (
            (navigator.language || (navigator.languages && navigator.languages[0]) || '').toLowerCase().startsWith('fr') ? 'fr' : 'ar'
          );
          document.documentElement.lang = lang;
          document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
